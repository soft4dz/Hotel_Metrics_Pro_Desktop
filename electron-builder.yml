appId: com.hotelmetricspro.desktop
productName: Hotel Metrics Pro Desktop
copyright: Copyright © Hotel Metrics Pro
directories:
  output: release
  buildResources: assets
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: electron/database/migrations
    to: migrations
    filter:
      - "**/*.sql"
  - from: assets/logos
    to: logos-default
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Hotel Metrics Pro
