appId: dz.raqmisystem.desktop
productName: Raqmi System
copyright: Copyright © Raqmi System
# better-sqlite3 est déjà précompilé via npm run rebuild:native (postinstall)
npmRebuild: false
forceCodeSigning: true
directories:
  output: installers
  buildResources: assets
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: electron/database/migrations
    to: migrations
    filter:
      - "**/*.sql"
  - from: assets/logos
    to: logos-default
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  # La signature est injectée par WIN_CSC_LINK / WIN_CSC_KEY_PASSWORD
  # (ou CSC_LINK / CSC_KEY_PASSWORD) dans l'environnement de build.
  signAndEditExecutable: true
  # icon: assets/icon.ico  # ajouter icon.ico pour une icône personnalisée (voir assets/README.md)
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Raqmi System
