appId: dz.raqmisystem.desktop
productName: Raqmi System
copyright: Copyright © Raqmi System
artifactName: Raqmi-System-${version}-Setup.${ext}
# better-sqlite3 est déjà précompilé via npm run rebuild:native (postinstall)
npmRebuild: false
directories:
  output: installers
  buildResources: assets
files:
  - dist/**/*
  - dist-electron/**/*
  - package.json
extraResources:
  - from: electron/database/migrations
    to: migrations
    filter:
      - "**/*.sql"
  - from: assets/logos
    to: logos-default
    filter:
      - "**/*"
win:
  target:
    - target: nsis
      arch:
        - x64
  signAndEditExecutable: false
  # icon: assets/icon.ico  # ajouter icon.ico pour une icône personnalisée (voir assets/README.md)
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Raqmi System
  uninstallDisplayName: Raqmi System
  license: assets/LICENSE-EULA.txt
