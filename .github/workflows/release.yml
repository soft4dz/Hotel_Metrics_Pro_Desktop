name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run rebuild:native
      - run: npm run validate:certification
      - name: Build signed-license installer
        run: npm run dist:installer
        env:
          HMP_LICENSE_PUBLIC_KEYS: ${{ secrets.HMP_LICENSE_PUBLIC_KEYS }}
      - uses: actions/upload-artifact@v4
        with:
          name: raqmi-system-installer
          path: installers/*.exe
          if-no-files-found: error
