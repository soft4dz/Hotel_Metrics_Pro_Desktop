name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Le postinstall reconstruit déjà better-sqlite3. En CI, on l'isole
      # dans l'étape suivante afin d'obtenir un diagnostic clair et d'éviter
      # une double reconstruction pendant npm ci.
      - run: npm ci --ignore-scripts
      - run: npm run rebuild:native
      - name: Tests
        run: npm test -- --reporter=json --outputFile=vitest-results.json
      - name: Publier le rapport Vitest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: vitest-results.json
          if-no-files-found: warn
          retention-days: 7
      - run: npm run build
