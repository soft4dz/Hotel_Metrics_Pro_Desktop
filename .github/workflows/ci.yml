name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Les scripts d'installation sont isolés afin de rendre chaque échec
      # explicite : dépendances JS, binaire Electron, puis module SQLite natif.
      - run: npm ci --ignore-scripts
      - name: Installer le binaire Electron
        run: node node_modules/electron/install.js
      - run: npm run rebuild:native
      - name: Tests
        run: npm test -- --reporter=json --outputFile=vitest-results.json
      - name: Publier le rapport Vitest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-results
          path: vitest-results.json
          if-no-files-found: warn
          retention-days: 7
      - run: npm run build
