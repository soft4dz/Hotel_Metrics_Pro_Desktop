name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/electron/install.js
      - run: npm run rebuild:native
      - run: npm test
      - run: npm run audit:ipc
      - run: npm run validate:packaging
      - run: npm run build
      - name: Build License Manager
        shell: bash
        run: |
          cd license-manager
          npm ci --ignore-scripts
          npm run build
      - name: Build central server
        shell: bash
        run: |
          cd server
          npm ci --ignore-scripts
          npm run prisma:generate
          npm run build
